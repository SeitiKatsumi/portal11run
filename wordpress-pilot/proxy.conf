# Add only these locations to the 11run.com.br HTTPS server in CapRover.
location = /global {
    return 308 /global/;
}

location ^~ /global/ {
    # Runtime lookup keeps the existing portal available even if the pilot is stopped.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $wordpress_pilot_upstream srv-captain--11run-wordpress-global:80;
    proxy_pass http://$wordpress_pilot_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_cache off;
    client_max_body_size 36m;
}
