Alias "/global/" "/var/www/html/"

<Directory "/var/www/html">
    AllowOverride None
    Options -Indexes +FollowSymLinks
    Require all granted
    DirectoryIndex index.php
    FallbackResource /global/index.php
</Directory>

<LocationMatch "^/(?!global(?:/|$))">
    Require all denied
</LocationMatch>

<LocationMatch "^/global(?:/|$)">
    AuthType Basic
    AuthName "11RUN | Global"
    AuthUserFile /run/11run-pilot.htpasswd
    Require valid-user
    RequestHeader unset Authorization
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set Cache-Control "private, no-store"
</LocationMatch>

<Location "/global/wp-config.php">
    Require all denied
</Location>
